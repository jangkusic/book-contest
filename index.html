<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>독후감·글쓰기 공모전 모아보기</title>
<meta name="description" content="전국 독후감·독서감상문 공모전을 한곳에. 지금 접수 중인 것과 곧 열릴 것을 대상별로 찾아보세요.">
<meta property="og:title" content="독후감 공모전 모아보기">
<meta property="og:description" content="전국 독후감·독서감상문 공모전을 한곳에. 지금 접수 중인 것과 곧 열릴 것을 대상별로.">
<meta property="og:type" content="website">
<style>
:root {
  --bg: #faf7f2; --card: #ffffff; --fg: #2b2620; --muted: #7a7065; --line: #e8e1d6;
  --accent: #b5532a; --accent-soft: #f6e6dc; --open: #2f7a4f; --open-soft: #e3f1e8;
  --soon: #8a6a1c; --soon-soft: #f5edd6; --chip: #f1ece4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1916; --card: #24211d; --fg: #ece6dc; --muted: #a59b8e; --line: #36322c;
    --accent: #e08a5f; --accent-soft: #3a2a20; --open: #6cc293; --open-soft: #1f3328;
    --soon: #d9b65e; --soon-soft: #352d18; --chip: #2e2a25;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1916; --card: #24211d; --fg: #ece6dc; --muted: #a59b8e; --line: #36322c;
  --accent: #e08a5f; --accent-soft: #3a2a20; --open: #6cc293; --open-soft: #1f3328;
  --soon: #d9b65e; --soon-soft: #352d18; --chip: #2e2a25;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
}
.wrap { max-width: 920px; margin: 0 auto; padding: 36px 16px 64px; }
header h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.02em; }
header p { margin: 0; color: var(--muted); font-size: 14px; }
.upd { font-size: 12px; color: var(--muted); margin-top: 6px; }

.tag.kind { font-weight: 600; }
.filters { margin: 24px 0 8px; display: flex; flex-direction: column; gap: 10px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.frow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.frow > span { font-size: 12px; color: var(--muted); width: 44px; flex: none; }
.chip { border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 20px;
  padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
input[type=search] { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; }

h2 { font-size: 18px; margin: 32px 0 4px; display: flex; align-items: baseline; gap: 8px; }
h2 .n { font-size: 13px; color: var(--muted); font-weight: 500; }
.sub { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.month { font-size: 13px; font-weight: 700; color: var(--soon); margin: 18px 0 8px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 6px; }
.card.open { border-color: var(--open); }
.top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.card h3 { font-size: 15px; margin: 0; line-height: 1.4; }
.badge { flex: none; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.badge.open { background: var(--open-soft); color: var(--open); }
.badge.soon { background: var(--soon-soft); color: var(--soon); }
.badge.urgent { background: var(--accent); color: #fff; }
.org { font-size: 12px; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; background: var(--chip); border-radius: 4px; padding: 1px 6px; color: var(--muted); }
.tag.local { background: var(--accent-soft); color: var(--accent); }
dl { margin: 2px 0 0; display: grid; grid-template-columns: 52px 1fr; gap: 2px 8px; font-size: 13px; }
dt { color: var(--muted); }
dd { margin: 0; }
.note { font-size: 12px; color: var(--muted); }
.card a { margin-top: auto; padding-top: 4px; font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 600; }
.card a:hover { text-decoration: underline; }
.empty { color: var(--muted); font-size: 14px; padding: 16px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; }

footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); line-height: 1.7; }
footer a { color: var(--accent); }
@media (max-width: 520px) { header h1 { font-size: 22px; } .frow > span { width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>독후감·글쓰기 공모전 모아보기</h1>
    <p>전국 독후감 공모전과 신춘문예·수필·칼럼 같은 글쓰기 공모전을 한곳에 모았어요. 지금 낼 수 있는 것과 곧 열릴 것을 대상별로 찾아보세요.</p>
    <div class="upd" id="upd"></div>
  </header>

  <div class="filters">
    <div class="frow"><span>종류</span><div class="frow" id="fKind"></div></div>
    <div class="frow"><span>대상</span><div class="frow" id="fTarget"></div></div>
    <div class="frow"><span>책</span><div class="frow" id="fBook"></div></div>
    <div class="frow"><span>지역</span><div class="frow" id="fScope"></div></div>
    <div class="frow"><span>검색</span><input type="search" id="q" placeholder="공모전 이름, 주최, 책 제목"></div>
  </div>

  <h2>지금 접수 중 <span class="n" id="nOpen"></span></h2>
  <p class="sub">마감이 가까운 순서예요.</p>
  <div class="grid" id="open"></div>

  <h2>곧 열림 <span class="n" id="nSoon"></span></h2>
  <p class="sub">대부분 매년 비슷한 때 열려요. 올해 마감된 공모전은 작년 일정을 기준으로 다음 접수 시기를 어림했어요.</p>
  <div id="soon"></div>

  <footer>
    정보는 각 주최 측 공고를 바탕으로 정리했지만 바뀔 수 있어요. 응모 전에 꼭 <b>원문 공고</b>를 확인하세요.<br>
    빠진 공모전이나 틀린 정보가 있으면 <a href="https://github.com/jangkusic/book-contest/issues" target="_blank" rel="noopener">여기로 알려주세요</a>.
  </footer>
</div>

<script src="data.js"></script>
<script>
(function () {
  var DAY = 86400000;
  var today = new Date(); today.setHours(0, 0, 0, 0);
  function d(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function md(dt) { return (dt.getMonth() + 1) + "월 " + dt.getDate() + "일"; }
  function ymd(dt) { return dt.getFullYear() + "." + (dt.getMonth() + 1) + "." + dt.getDate(); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  document.getElementById("upd").textContent = "마지막 정리 " + window.UPDATED.replace(/-/g, ".") + " · 공모전 " + window.CONTESTS.length + "개";

  // 다음 접수 시기 — 올해 마감됐으면 해마다 같은 때 열린다고 보고 1년씩 미룹니다
  var items = window.CONTESTS.map(function (c) {
    var e = d(c.end), s = c.start ? d(c.start) : new Date(e.getTime() - 40 * DAY), status, ns = s, ne = e, guess = false;
    if (!c.start && today <= e) s = ns = new Date(Math.min(s, today));
    if (today >= s && today <= e) status = "open";
    else if (today < s) status = "soon";
    else {
      status = "soon"; guess = true;
      while (ne < today) { ns = new Date(ns.getFullYear() + 1, ns.getMonth(), ns.getDate()); ne = new Date(ne.getFullYear() + 1, ne.getMonth(), ne.getDate()); }
    }
    return { c: c, status: status, s: ns, e: ne, guess: guess, left: Math.round((ne - today) / DAY) };
  });

  var F = { kind: "전체", target: "전체", book: "전체", scope: "전체", q: "" };
  function chips(id, key, opts) {
    var el = document.getElementById(id);
    el.innerHTML = opts.map(function (o) { return '<button class="chip" type="button" data-v="' + o + '" aria-pressed="' + (F[key] === o) + '">' + o + "</button>"; }).join("");
    el.onclick = function (ev) {
      var b = ev.target.closest(".chip"); if (!b) return;
      F[key] = b.dataset.v;
      el.querySelectorAll(".chip").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      render();
    };
  }
  chips("fKind", "kind", ["전체", "독후감", "신춘문예", "문학상", "수필·에세이", "칼럼·논술"]);
  chips("fTarget", "target", ["전체", "초등", "청소년", "일반", "청년", "여성"]);
  chips("fBook", "book", ["전체", "자유", "지정", "주제"]);
  chips("fScope", "scope", ["전체", "전국만"]);
  document.getElementById("q").oninput = function () { F.q = this.value.trim(); render(); };

  function pass(it) {
    var c = it.c;
    if (F.kind !== "전체" && (c.kind || "독후감") !== F.kind) return false;
    if (F.target !== "전체" && c.targets.indexOf(F.target) < 0) return false;
    if (F.book !== "전체" && c.book !== F.book) return false;
    if (F.scope === "전국만" && c.scope !== "전국") return false;
    if (F.q) {
      var hay = [c.name, c.org, c.books, c.genre, c.kind, c.note, c.scope].join(" ");
      if (hay.indexOf(F.q) < 0) return false;
    }
    return true;
  }
  var BOOK = { "지정": "지정도서", "자유": "책 자유", "주제": "주제 지정" };

  function card(it) {
    var c = it.c, badge;
    if (it.status === "open") {
      badge = it.left <= 7
        ? '<span class="badge urgent">' + (it.left === 0 ? "오늘 마감" : "D-" + it.left) + "</span>"
        : '<span class="badge open">D-' + it.left + "</span>";
    } else if (!it.guess && c.start) {
      badge = '<span class="badge soon">' + md(it.s) + " 시작</span>";
    } else {
      badge = '<span class="badge soon">' + it.s.getFullYear() + "년 " + (it.s.getMonth() + 1) + "월쯤</span>";
    }
    var period = !c.start
      ? (it.guess ? "작년 마감 " + ymd(d(c.end)) : "~ " + ymd(it.e) + " 마감")
      : it.status === "open" || !it.guess
      ? ymd(it.s) + " ~ " + ymd(it.e)
      : "작년 " + ymd(d(c.start)) + " ~ " + ymd(d(c.end));
    return '<article class="card' + (it.status === "open" ? " open" : "") + '">' +
      '<div class="top"><h3>' + esc(c.name) + "</h3>" + badge + "</div>" +
      '<div class="org">' + esc(c.org) + (c.cycle && c.cycle !== "매년" ? " · " + esc(c.cycle) : "") + "</div>" +
      '<div class="tags">' + c.targets.map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") +
      (c.kind ? '<span class="tag kind">' + esc(c.kind) + "</span>" : "") +
      (c.book ? '<span class="tag">' + esc(BOOK[c.book] || c.book) + "</span>" : "") +
      (c.scope !== "전국" ? '<span class="tag local">' + esc(c.scope) + " 주민만</span>" : "") + "</div>" +
      "<dl><dt>접수</dt><dd>" + esc(period) + "</dd>" +
      (c.genre ? "<dt>분야</dt><dd>" + esc(c.genre) + "</dd>" : "") +
      (c.books ? "<dt>도서</dt><dd>" + esc(c.books) + "</dd>" : "") +
      (c.prize ? "<dt>시상</dt><dd>" + esc(c.prize) + "</dd>" : "") + "</dl>" +
      (c.note ? '<div class="note">' + esc(c.note) + "</div>" : "") +
      '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">원문 공고 보기 →</a></article>';
  }

  function render() {
    var list = items.filter(pass);
    var open = list.filter(function (i) { return i.status === "open"; }).sort(function (a, b) { return a.e - b.e; });
    var soon = list.filter(function (i) { return i.status === "soon"; }).sort(function (a, b) { return a.s - b.s; });
    document.getElementById("nOpen").textContent = open.length + "개";
    document.getElementById("nSoon").textContent = soon.length + "개";
    document.getElementById("open").innerHTML = open.length ? open.map(card).join("")
      : '<div class="empty" style="grid-column:1/-1">지금 조건에 맞는 공모전이 없어요. 아래 "곧 열림"을 확인해 보세요.</div>';
    // 시작하는 달별로 묶기
    var html = "", cur = "";
    soon.forEach(function (it) {
      var key = it.s.getFullYear() + "년 " + (it.s.getMonth() + 1) + "월";
      if (key !== cur) { if (cur) html += "</div>"; html += '<div class="month">' + key + '</div><div class="grid">'; cur = key; }
      html += card(it);
    });
    if (cur) html += "</div>";
    document.getElementById("soon").innerHTML = html || '<div class="empty">조건에 맞는 공모전이 없어요.</div>';
  }
  render();
})();
</script>
</body>
</html>
